<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasty Bites | Contact Messages</title>


    <style>

        /* ================= GLOBAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(232, 155, 45, 0.15),
                    transparent 25%
                ),

                linear-gradient(
                    135deg,
                    #f8f3e8,
                    #eee2cd
                );

            color: #3a2f24;

        }


        /* ================= HEADER ================= */

        header {

            background:
                linear-gradient(
                    135deg,
                    #10251b,
                    #183528
                );

            padding: 25px 8%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 5px 20px
                rgba(16, 37, 27, 0.25);

        }


        .logo {

            color: #fff8e8;

            font-size: 27px;

            font-weight: bold;

        }


        .logo span {

            color: #e89b2d;

        }


        .back-btn {

            text-decoration: none;

            color: white;

            background: #e89b2d;

            padding: 10px 20px;

            border-radius: 25px;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;

        }


        .back-btn:hover {

            background: #d4871e;

            transform: translateY(-2px);

        }


        /* ================= PAGE ================= */

        .container {

            width: 90%;

            max-width: 1200px;

            margin: 50px auto;

        }


        .page-title {

            text-align: center;

            margin-bottom: 35px;

        }


        .page-title .icon {

            font-size: 45px;

            margin-bottom: 10px;

        }


        .page-title h1 {

            color: #183528;

            font-size: 38px;

            margin-bottom: 8px;

        }


        .page-title h1 span {

            color: #d4871e;

        }


        .page-title p {

            color: #756d63;

        }


        .line {

            width: 65px;

            height: 4px;

            background: #e89b2d;

            border-radius: 10px;

            margin: 15px auto;

        }


        /* ================= MESSAGE COUNT ================= */

        .message-count {

            background: #183528;

            color: white;

            padding: 18px 25px;

            border-radius: 15px;

            margin-bottom: 25px;

            font-size: 16px;

            font-weight: 600;

        }


        .message-count span {

            color: #e89b2d;

            font-size: 22px;

        }


        /* ================= TABLE CARD ================= */

        .table-card {

            background: #fffaf0;

            border-radius: 20px;

            overflow: hidden;

            border: 1px solid #e5d8c2;

            box-shadow:
                0 15px 40px
                rgba(40, 50, 35, 0.12);

        }


        /* ================= TABLE ================= */

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 800px;

        }


        thead {

            background: #183528;

            color: white;

        }


        th {

            padding: 18px 15px;

            text-align: left;

            font-size: 14px;

            white-space: nowrap;

        }


        td {

            padding: 17px 15px;

            border-bottom: 1px solid #eadfce;

            font-size: 14px;

            vertical-align: top;

        }


        tbody tr {

            transition: 0.25s;

        }


        tbody tr:hover {

            background: #f7f0e3;

        }


        tbody tr:last-child td {

            border-bottom: none;

        }


        /* ================= MESSAGE COLUMN ================= */

        .message {

            max-width: 350px;

            line-height: 1.6;

            color: #5c5247;

        }


        /* ================= DELETE BUTTON ================= */

        .delete-btn {

            border: none;

            background: #c94c4c;

            color: white;

            padding: 9px 15px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 13px;

            font-weight: bold;

            transition: 0.3s;

        }


        .delete-btn:hover {

            background: #a93636;

            transform: translateY(-2px);

        }


        /* ================= EMPTY ================= */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #777;

        }


        .empty-icon {

            font-size: 50px;

            margin-bottom: 15px;

        }


        .empty h2 {

            color: #183528;

            margin-bottom: 8px;

        }


        /* ================= LOADING ================= */

        .loading {

            text-align: center;

            padding: 40px;

            color: #756d63;

            font-weight: 600;

        }


        /* ================= FOOTER ================= */

        footer {

            margin-top: 70px;

            background: #10251b;

            color: #cbd4cd;

            text-align: center;

            padding: 25px;

            border-top: 3px solid #e89b2d;

            font-size: 13px;

        }


        footer span {

            color: #e89b2d;

            font-weight: bold;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {

                flex-direction: column;

                gap: 15px;

                text-align: center;

            }


            .container {

                width: 94%;

                margin: 35px auto;

            }


            .page-title h1 {

                font-size: 30px;

            }


            .message-count {

                text-align: center;

            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            🍴 Tasty<span>Bites</span>

        </div>


        <a
            href="index.html"
            class="back-btn">

            🏠 Back to Home

        </a>

    </header>



    <!-- ================= MAIN ================= -->

    <div class="container">


        <!-- TITLE -->

        <div class="page-title">

            <div class="icon">
                💬
            </div>


            <h1>

                Contact
                <span>Messages</span>

            </h1>


            <div class="line"></div>


            <p>

                View messages received from customers

            </p>

        </div>



        <!-- MESSAGE COUNT -->

        <div class="message-count">

            📩 Total Messages:
            <span id="messageCount">0</span>

        </div>



        <!-- TABLE -->

        <div class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Message
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="messageTable">

                        <tr>

                            <td
                                colspan="5"
                                class="loading">

                                Loading messages...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer>

        🍴 <span>Tasty Bites</span>
        — Restaurant Management System

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ==================================================
           LOAD ALL CONTACT MESSAGES
        ================================================== */

        function loadMessages() {


            fetch(
                "http://localhost:8085/api/contact"
            )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to load messages"
                    );

                }


                return response.json();

            })


            .then(messages => {

                const table =
                    document.getElementById(
                        "messageTable"
                    );


                const count =
                    document.getElementById(
                        "messageCount"
                    );


                count.innerText =
                    messages.length;


                table.innerHTML = "";


                /* ================= EMPTY ================= */

                if (messages.length === 0) {

                    table.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                class="empty">

                                <div class="empty-icon">
                                    📭
                                </div>

                                <h2>
                                    No Messages Yet
                                </h2>

                                <p>
                                    Customer messages will
                                    appear here.
                                </p>

                            </td>

                        </tr>

                    `;

                    return;

                }


                /* ================= DISPLAY MESSAGES ================= */

                messages.forEach(message => {


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${message.id}
                        </td>


                        <td>
                            <strong>
                                ${message.name}
                            </strong>
                        </td>


                        <td>
                            ${message.email}
                        </td>


                        <td class="message">
                            ${message.message}
                        </td>


                        <td>

                            <button
                                class="delete-btn"
                                onclick="deleteMessage(${message.id})">

                                🗑️ Delete

                            </button>

                        </td>

                    `;


                    table.appendChild(row);

                });

            })


            .catch(error => {

                console.error(error);


                document.getElementById(
                    "messageTable"
                ).innerHTML = `

                    <tr>

                        <td
                            colspan="5"
                            class="empty">

                            <div class="empty-icon">
                                ⚠️
                            </div>

                            <h2>
                                Unable to Load Messages
                            </h2>

                            <p>
                                Please make sure the
                                Spring Boot application
                                is running.
                            </p>

                        </td>

                    </tr>

                `;

            });

        }



        /* ==================================================
           DELETE MESSAGE
        ================================================== */

        function deleteMessage(id) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this message?"
                );


            if (!confirmDelete) {

                return;

            }


            fetch(
                `http://localhost:8085/api/contact/${id}`,
                {
                    method: "DELETE"
                }
            )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Delete failed"
                    );

                }


                alert(
                    "✅ Message deleted successfully!"
                );


                loadMessages();

            })


            .catch(error => {

                console.error(error);


                alert(
                    "❌ Unable to delete message."
                );

            });

        }



        /* ==================================================
           LOAD MESSAGES WHEN PAGE OPENS
        ================================================== */

        loadMessages();

    </script>


</body>

</html>
