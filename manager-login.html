<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Login - Tasty Bites</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #e85d04;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e85d04;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94801;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>👨‍💼 Tasty Bites</h2>

    <p class="subtitle">Manager Login</p>

    <form id="managerLoginForm">

        <label>Username</label>

        <input
            type="text"
            id="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

document.getElementById("managerLoginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        const response = await fetch(
            "http://localhost:8085/api/managers/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error("Login failed");
        }

        localStorage.setItem(
            "loggedInManager",
            JSON.stringify(data)
        );

        document.getElementById("message").innerHTML =
            "✅ Login successful!";

        document.getElementById("message").style.color =
            "green";

        setTimeout(function() {

            window.location.href =
                "manager-dashboard.html";

        }, 1000);

    } catch (error) {

        console.error(error);

        document.getElementById("message").innerHTML =
            "❌ Invalid username or password.";

        document.getElementById("message").style.color =
            "red";
    }

});

</script>

</body>
</html>
