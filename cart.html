<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tasty Bites | My Cart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #222;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255, 152, 0, 0.18),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 90% 25%,
                    rgba(255, 193, 7, 0.15),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 50% 90%,
                    rgba(255, 87, 34, 0.10),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #fffaf3,
                    #f7ead8
                );
        }


        /* ================= HEADER ================= */

        header {
            background:
                linear-gradient(
                    135deg,
                    #171717,
                    #343434,
                    #202020
                );

            color: white;

            padding: 30px 20px;

            text-align: center;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.25);
        }


        header h1 {
            font-size: 42px;

            letter-spacing: 1px;

            margin-bottom: 8px;
        }


        header h1 span {
            color: #ff9800;
        }


        header p {
            color: #ddd;

            font-size: 16px;

            letter-spacing: 1px;
        }


        /* ================= MAIN ================= */

        .cart-section {

            max-width: 1150px;

            margin: 45px auto;

            padding: 0 20px;
        }


        /* ================= TITLE ================= */

        .title {

            text-align: center;

            margin-bottom: 35px;
        }


        .title h2 {

            font-size: 34px;

            color: #252525;

            margin-bottom: 10px;
        }


        .title p {

            color: #777;

            font-size: 15px;
        }


        .line {

            width: 75px;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #ff9800,
                    #ff5722
                );

            margin: 14px auto;

            border-radius: 20px;
        }


        /* ================= CART LAYOUT ================= */

        .cart-layout {

            display: grid;

            grid-template-columns:
                1fr 350px;

            gap: 30px;

            align-items: start;
        }


        /* ================= CART ITEMS ================= */

        .cart-items {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .cart-item {

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fffaf5
                );

            border: 1px solid
                rgba(255, 152, 0, 0.18);

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 8px 25px
                rgba(80, 50, 20, 0.10);

            display: grid;

            grid-template-columns:
                1fr auto;

            gap: 20px;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .cart-item:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 15px 30px
                rgba(255, 111, 0, 0.15);
        }


        /* ================= ITEM DETAILS ================= */

        .item-info h3 {

            color: #222;

            font-size: 21px;

            margin-bottom: 8px;
        }


        .item-restaurant {

            display: inline-block;

            background: #fff3e0;

            color: #e65100;

            padding: 5px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .item-category {

            color: #777;

            font-size: 13px;

            margin-bottom: 8px;
        }


        .item-price {

            color: #e53935;

            font-size: 18px;

            font-weight: bold;
        }


        /* ================= RIGHT SIDE ================= */

        .item-right {

            text-align: right;

            min-width: 170px;
        }


        .item-total {

            color: #ff6f00;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        /* ================= QUANTITY ================= */

        .quantity-box {

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 8px;

            margin-bottom: 12px;
        }


        .quantity-btn {

            width: 34px;

            height: 34px;

            border: none;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff9800,
                    #ff6f00
                );

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.2s ease;
        }


        .quantity-btn:hover {

            transform:
                scale(1.1);
        }


        .quantity {

            min-width: 35px;

            text-align: center;

            font-size: 16px;

            font-weight: bold;
        }


        /* ================= REMOVE ================= */

        .remove-btn {

            border: none;

            background: transparent;

            color: #e53935;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition:
                color 0.2s ease;
        }


        .remove-btn:hover {

            color: #b71c1c;

            text-decoration: underline;
        }


        /* ================= SUMMARY ================= */

        .summary {

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fff8ef
                );

            border: 1px solid
                rgba(255, 152, 0, 0.20);

            border-radius: 24px;

            padding: 25px;

            box-shadow:
                0 10px 30px
                rgba(80, 50, 20, 0.12);

            position: sticky;

            top: 20px;
        }


        .summary h3 {

            font-size: 24px;

            color: #252525;

            margin-bottom: 22px;

            text-align: center;
        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px 0;

            color: #666;

            font-size: 15px;
        }


        .summary-row strong {

            color: #222;
        }


        .summary-divider {

            height: 1px;

            background: #ddd;

            margin: 10px 0;
        }


        .grand-total {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding-top: 15px;

            font-size: 21px;

            font-weight: bold;

            color: #e53935;
        }


        /* ================= CHECKOUT ================= */

        .checkout-btn {

            display: block;

            width: 100%;

            border: none;

            margin-top: 22px;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ff9800,
                    #ff6f00
                );

            color: white;

            border-radius: 30px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 20px
                rgba(255, 111, 0, 0.28);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .checkout-btn:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 12px 28px
                rgba(255, 111, 0, 0.40);
        }


        /* ================= CONTINUE SHOPPING ================= */

        .continue-btn {

            display: block;

            text-align: center;

            margin-top: 12px;

            padding: 13px;

            background:
                linear-gradient(
                    135deg,
                    #222,
                    #444
                );

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 14px;

            font-weight: bold;

            transition:
                transform 0.3s ease,
                background 0.3s ease;
        }


        .continue-btn:hover {

            transform:
                translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    #ff9800,
                    #ff6f00
                );
        }


        /* ================= EMPTY CART ================= */

        .empty-cart {

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #fffaf5
                );

            border-radius: 25px;

            padding: 60px 25px;

            box-shadow:
                0 10px 30px
                rgba(80, 50, 20, 0.10);
        }


        .empty-cart .emoji {

            font-size: 70px;

            margin-bottom: 20px;
        }


        .empty-cart h3 {

            font-size: 25px;

            margin-bottom: 10px;

            color: #333;
        }


        .empty-cart p {

            color: #777;

            margin-bottom: 25px;
        }


        /* ================= FOOTER ================= */

        footer {

            background: #222;

            color: #bbb;

            text-align: center;

            padding: 25px;

            margin-top: 50px;

            font-size: 14px;
        }


        footer strong {

            color: #ff9800;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .cart-layout {

                grid-template-columns: 1fr;
            }

            .summary {

                position: static;
            }

        }


        @media (max-width: 600px) {

            header h1 {

                font-size: 32px;
            }


            .title h2 {

                font-size: 28px;
            }


            .cart-item {

                grid-template-columns: 1fr;

                text-align: center;
            }


            .item-right {

                text-align: center;

                min-width: auto;
            }


            .quantity-box {

                justify-content: center;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <h1>
            🛒 Tasty<span>Bites</span> Cart
        </h1>

        <p>
            Your delicious choices are waiting for you ❤️
        </p>

    </header>


    <!-- ================= MAIN ================= -->

    <section class="cart-section">


        <!-- ================= TITLE ================= -->

        <div class="title">

            <h2>
                Your Shopping Cart
            </h2>

            <div class="line"></div>

            <p>
                Review your items before placing your order
            </p>

        </div>


        <!-- ================= CART CONTENT ================= -->

        <div id="cartContent">

            <!-- JavaScript will load cart here -->

        </div>


    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026

        <strong>Tasty Bites</strong>

        |

        Delicious Food, Happy Mood ❤️

    </footer>


    <script>


        // =====================================================
        // GET CART
        // =====================================================


        function getCart() {

            return JSON.parse(

                localStorage.getItem(
                    "tastyBitesCart"
                ) || "[]"

            );

        }


        // =====================================================
        // SAVE CART
        // =====================================================


        function saveCart(cart) {

            localStorage.setItem(

                "tastyBitesCart",

                JSON.stringify(cart)

            );

        }


        // =====================================================
        // RESTAURANT NAMES
        // =====================================================


        const restaurants = {

            1: "Spice Garden",

            2: "Food Corner",

            3: "Urban Spice"

        };


        // =====================================================
        // LOAD CART
        // =====================================================


        function loadCart() {


            const cart =
                getCart();


            const cartContent =
                document.getElementById(
                    "cartContent"
                );


            // =================================================
            // EMPTY CART
            // =================================================


            if (
                !cart ||
                cart.length === 0
            ) {

                cartContent.innerHTML = `

                    <div class="empty-cart">

                        <div class="emoji">
                            🛒
                        </div>

                        <h3>
                            Your Cart is Empty
                        </h3>

                        <p>
                            Looks like you haven't
                            added anything yet.
                        </p>

                        <a
                            href="menu.html"
                            class="continue-btn"
                            style="
                                max-width:220px;
                                margin:0 auto;
                            "
                        >
                            🍴 Explore Menu
                        </a>

                    </div>

                `;

                return;

            }


            // =================================================
            // TOTALS
            // =================================================


            let totalItems = 0;

            let totalPrice = 0;


            cart.forEach(item => {

                totalItems +=
                    Number(item.quantity);

                totalPrice +=
                    Number(item.price)
                    *
                    Number(item.quantity);

            });


            // =================================================
            // CREATE CART ITEMS
            // =================================================


            let itemsHTML = "";


            cart.forEach(
                (item, index) => {


                    const itemTotal =
                        Number(item.price)
                        *
                        Number(item.quantity);


                    const restaurantName =
                        restaurants[
                            Number(
                                item.restaurantId
                            )
                        ] || "Tasty Bites";


                    itemsHTML += `

                        <div class="cart-item">

                            <div class="item-info">

                                <span
                                    class="item-restaurant"
                                >
                                    🍽️ ${restaurantName}
                                </span>

                                <h3>
                                    ${item.name}
                                </h3>

                                <p
                                    class="item-category"
                                >
                                    Category:
                                    ${item.category || "Food"}
                                </p>

                                <div class="item-price">
                                    ₹${item.price}
                                    / item
                                </div>

                            </div>


                            <div class="item-right">

                                <div class="item-total">
                                    ₹${itemTotal}
                                </div>


                                <div class="quantity-box">

                                    <button
                                        class="quantity-btn"
                                        onclick="decreaseQuantity(${index})"
                                    >
                                        −
                                    </button>


                                    <span
                                        class="quantity"
                                    >
                                        ${item.quantity}
                                    </span>


                                    <button
                                        class="quantity-btn"
                                        onclick="increaseQuantity(${index})"
                                    >
                                        +
                                    </button>

                                </div>


                                <button
                                    class="remove-btn"
                                    onclick="removeItem(${index})"
                                >
                                    ❌ Remove
                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            // =================================================
            // FINAL CART HTML
            // =================================================


            cartContent.innerHTML = `

                <div class="cart-layout">


                    <div class="cart-items">

                        ${itemsHTML}

                    </div>


                    <div class="summary">

                        <h3>
                            🧾 Order Summary
                        </h3>


                        <div class="summary-row">

                            <span>
                                Items
                            </span>

                            <strong>
                                ${totalItems}
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>
                                Subtotal
                            </span>

                            <strong>
                                ₹${totalPrice}
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>
                                Delivery
                            </span>

                            <strong>
                                Free
                            </strong>

                        </div>


                        <div
                            class="summary-divider"
                        ></div>


                        <div class="grand-total">

                            <span>
                                Total
                            </span>

                            <span>
                                ₹${totalPrice}
                            </span>

                        </div>


                        <button
                            class="checkout-btn"
                            onclick="proceedToOrder()"
                        >
                            🛍️ Proceed to Order
                        </button>


                        <a
                            href="menu.html"
                            class="continue-btn"
                        >
                            🍴 Continue Shopping
                        </a>

                    </div>


                </div>

            `;

        }


        // =====================================================
        // INCREASE QUANTITY
        // =====================================================


        function increaseQuantity(index) {


            const cart =
                getCart();


            cart[index].quantity =
                Number(
                    cart[index].quantity
                ) + 1;


            saveCart(cart);


            loadCart();

        }


        // =====================================================
        // DECREASE QUANTITY
        // =====================================================


        function decreaseQuantity(index) {


            const cart =
                getCart();


            if (
                Number(
                    cart[index].quantity
                ) > 1
            ) {

                cart[index].quantity =
                    Number(
                        cart[index].quantity
                    ) - 1;

            }

            else {

                cart.splice(index, 1);

            }


            saveCart(cart);


            loadCart();

        }


        // =====================================================
        // REMOVE ITEM
        // =====================================================


        function removeItem(index) {


            const cart =
                getCart();


            cart.splice(
                index,
                1
            );


            saveCart(cart);


            loadCart();

        }


        // =====================================================
        // PROCEED TO ORDER
        // =====================================================


        function proceedToOrder() {


            const cart =
                getCart();


            if (
                !cart ||
                cart.length === 0
            ) {

                alert(
                    "🛒 Your cart is empty!"
                );

                return;

            }


            /*
             * For now we redirect to contact.html.
             *
             * In the next step we can connect
             * this cart directly with the
             * existing OrderService.
             */


            const firstItem =
                cart[0];


            window.location.href =
                "contact.html?food="
                +
                encodeURIComponent(
                    firstItem.name
                )
                +
                "&price="
                +
                firstItem.price
                +
                "&restaurantId="
                +
                firstItem.restaurantId;

        }


        // =====================================================
        // INITIAL LOAD
        // =====================================================


        loadCart();

    </script>


</body>

</html>
