<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Tasty Bites</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #e85d04;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #e85d04;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94801;
        }

        .register-link {
            text-align: center;
            margin-top: 18px;
        }

        .register-link a {
            color: #e85d04;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>🍴 Tasty Bites</h2>
    <p class="subtitle">Customer Login</p>

    <form id="loginForm">

        <label>Username</label>
        <input type="text" id="username" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>

    </form>

    <div id="message"></div>

    <div class="register-link">
        Don't have an account?
        <a href="customer-register.html">Register</a>
    </div>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const loginData = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value
    };

    try {

        const response = await fetch(
            "http://localhost:8085/api/customers/login",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(loginData)
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error("Invalid username or password");
        }

        // Save logged-in customer
        localStorage.setItem(
            "loggedInCustomer",
            JSON.stringify(data)
        );

        document.getElementById("message").innerHTML =
            "✅ Login successful!";

        setTimeout(function() {

            window.location.href = "index.html";

        }, 1000);

    } catch (error) {

        console.error(error);

        document.getElementById("message").innerHTML =
            "❌ Invalid username or password";

    }

});

</script>

</body>
</html>
